services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-private_rollup}
      POSTGRES_USER: ${POSTGRES_USER:-private_rollup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-private_rollup_dev_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres18-data:/var/lib/postgresql

  minio:
    image: minio/minio:RELEASE.2026-07-16T22-36-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-private_rollup}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-private_rollup_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

volumes:
  postgres18-data:
  minio-data:
